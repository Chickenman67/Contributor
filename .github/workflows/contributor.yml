name: nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no push)"
        default: "false"
permissions:
  contents: write
concurrency:
  group: contributor-nightly
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          token: ${{ secrets.BOT_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "contributor-bot"
          git config user.email "contributor-bot@example.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m src.cli --dry-run; else python -m src.cli; fi
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BOT_ACCOUNT: Chickenman67
